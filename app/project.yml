# XcodeGen spec — generates GlassesTranslations.xcodeproj (do not edit the
# generated project; edit this file instead).
#
#   cd app && xcodegen generate && pod install
#   open GlassesTranslations.xcodeproj  (or build app.xcworkspace)
#
# CI (.github/workflows/ios.yml, "app" job) runs exactly this.
#
# NOTE: PRODUCT_BUNDLE_IDENTIFIER must sit under the App ID prefix of whatever
# Apple Developer Team signs builds (e.g. a friend's team wildcard) — change it
# before device/TestFlight signing.
# NOTE: Deployment target 18.0 keeps the skeleton building on Xcode 16.x CI
# runners. Bump to 26.0 (macos-26 runner + Xcode 26) when Apple's Translation
# framework is wired in.

name: GlassesTranslations
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: false

targets:
  app:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Glasses Translations
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "1"
        # Screen-off BLE + mic use (see AGENTS.md domain facts).
        UIBackgroundModes: [bluetooth-central, audio]
        NSBluetoothAlwaysUsageDescription: >-
          Connects to your Even Realities G1 glasses to show live translations.
        NSBluetoothPeripheralUsageDescription: >-
          Connects to your Even Realities G1 glasses to show live translations.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.glasstranslations
